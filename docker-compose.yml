services:
  postgres:
    image: postgres:16-alpine
    container_name: faud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faud_password}
      POSTGRES_DB: ${POSTGRES_DB:-repositorio_faud}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faud_user} -d ${POSTGRES_DB:-repositorio_faud}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: faud_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # SPA de producción (nginx). Opcional: `docker compose --profile frontend up -d --build`.
  # Reenvía /api al Backend NestJS que corre en el host (pnpm run start:dev en backend/).
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SHOW_DEMO_ACCOUNTS: ${VITE_SHOW_DEMO_ACCOUNTS:-false}
    image: faud-unsj-frontend:latest
    container_name: faud_frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
    name: faud_repositorio_postgres_data
